<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>화학 섬 이야기</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2a2e;font-family:"Malgun Gothic","Nanum Gothic",sans-serif;user-select:none;color:#4a3326}
  #game{position:absolute;width:960px;height:600px;transform-origin:top left;background:#000;overflow:hidden}
  canvas#cv{display:block;width:960px;height:600px;image-rendering:pixelated}
  .pill{position:absolute;background:rgba(255,251,234,.92);border:3px solid #9b6b43;border-radius:20px;padding:3px 14px;font-size:14px;font-weight:bold;box-shadow:0 2px 0 rgba(0,0,0,.2)}
  #coin{left:12px;top:10px}
  #clock{right:12px;top:10px}
  #track{right:12px;top:48px;max-width:300px;font-size:13px;font-weight:normal;line-height:1.5;display:none}
  #hint{left:12px;bottom:10px;font-size:12px;font-weight:normal;opacity:.9}
  #netpill{left:12px;top:46px;display:none;font-size:13px}
  #cap{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;width:min(780px,86%);text-align:center;color:#fff;background:rgba(10,14,30,.66);border-radius:14px;padding:10px 18px;font-size:19px;line-height:1.5;opacity:0;transition:opacity .4s;pointer-events:none;z-index:15;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  #skip{display:none;position:absolute;right:14px;top:12px;z-index:30;font:inherit;font-size:14px;font-weight:bold;background:rgba(255,251,234,.92);border:3px solid #9b6b43;border-radius:20px;padding:3px 14px;cursor:pointer;color:#4a3326}
  .cutscene #skip{display:block}
  .cutscene .pill,.cutscene #hint,.cutscene #touch,.cutscene #mobcap,.cutscene #mobmenu{display:none!important}
  #start.hasbg{background-size:cover;background-position:center;background-repeat:no-repeat}
  #start.hasbg>p,#start.hasbg #setup p{background:rgba(255,251,234,.84);border-radius:12px;padding:4px 14px}
  #start h1.logo{margin:0;text-shadow:none}
  #start h1.logo img{display:block;max-width:min(360px,70vw);max-height:34vh;object-fit:contain}
  #start.setting>p{display:none}
  #start.setting h1{font-size:34px;margin-bottom:2px}
  .mob #start.setting h1{font-size:28px}
  #start{overflow-y:auto}
  #setup{display:none;max-width:440px}
  #setup p{font-size:14px;line-height:1.5}
  #setup input{font:inherit;font-size:18px;padding:6px 12px;border:3px solid #b8832a;border-radius:12px;text-align:center;width:200px;margin-top:6px}
  #sshirts{margin:8px 0 2px}
  #sshirts .sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;margin:4px;cursor:pointer;padding:0}
  #sshirts .sw.on{border-color:#e8802a;box-shadow:0 0 0 3px #fff}
  #smsg{min-height:20px;font-size:13px;color:#b03a2a}
  #setup .btn{font-size:19px;padding:8px 26px}
  #raidhud{left:50%;transform:translateX(-50%);top:10px;display:none;font-size:13px;white-space:nowrap}
  #mobemo{display:none}
  #toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:rgba(60,40,25,.88);color:#fff;border-radius:14px;padding:7px 18px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:pre-wrap;text-align:center;max-width:620px}
  #dlg{position:absolute;left:90px;right:90px;bottom:18px;background:#fffbea;border:4px solid #9b6b43;border-radius:20px;padding:22px 26px 14px;display:none;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  #dwho{position:absolute;left:22px;top:-18px;background:#6cc070;color:#fff;font-weight:bold;border:3px solid #3f8f48;border-radius:14px;padding:2px 16px;font-size:15px}
  #dtxt{font-size:18px;line-height:1.65;min-height:60px;white-space:pre-wrap}
  #dopts{margin-top:6px}
  .opt{display:block;font-size:16px;padding:4px 12px;margin:3px 0;border-radius:10px;cursor:pointer;color:#2c6a9e}
  .opt.sel{background:#ffe9a8;color:#8a4a10;font-weight:bold}
  #dnext{position:absolute;right:26px;bottom:10px;color:#e8802a;animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.2}}
  #win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffbea;border:4px solid #9b6b43;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.35);display:none;max-height:540px;overflow:hidden}
  #whd{background:#6cc070;color:#fff;font-weight:bold;padding:8px 16px;font-size:17px;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px 0 #3f8f48}
  #wx{background:#e86a6a;color:#fff;border:2px solid #a83a3a;border-radius:10px;font-weight:bold;cursor:pointer;font-family:inherit}
  #wb{padding:14px 18px;overflow:auto;max-height:470px;font-size:14px;line-height:1.6}
  .btn{font:inherit;font-size:14px;font-weight:bold;background:#ffd36b;color:#6a3a10;border:2px solid #b8832a;border-radius:12px;padding:4px 14px;cursor:pointer;box-shadow:0 2px 0 #b8832a;margin:2px}
  .btn:hover{filter:brightness(1.07)}
  .btn.on{background:#8fd694;border-color:#3f8f48;box-shadow:0 2px 0 #3f8f48;color:#1d4a22}
  .btn.dis{background:#ddd;border-color:#aaa;box-shadow:none;color:#888;cursor:not-allowed}
  .btn.sm{padding:0 10px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .cell{background:#fff;border:2px solid #d9b98a;border-radius:12px;text-align:center;padding:6px 2px;cursor:pointer}
  .cell.sel{border-color:#e8802a;background:#fff2cf}
  .cell .em{font-size:26px}.cell .nm{font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .note{background:#fff4d2;border-radius:10px;padding:6px 10px;margin:6px 0;font-size:13px}
  .sub{font-weight:bold;margin:4px 0}
  .empty{color:#9a8a7a;padding:20px;text-align:center}
  .bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
  .bar span{width:120px}.bar b{width:130px;text-align:right}
  .track{flex:1;height:14px;background:#eadfc8;border-radius:8px;overflow:hidden;border:2px solid #cdb68a}
  .track i{display:block;height:100%;transition:width .5s}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td,th{border-bottom:1px solid #e3d3b4;padding:3px 6px;text-align:left}
  .rec{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e3d3b4;border-radius:12px;padding:6px 10px;margin:6px 0}
  .rec .em{font-size:26px}.rec .info{flex:1}
  .ok{color:#2c8a3a;font-weight:bold}.no{color:#c04a3a}
  input[type=range]{width:240px}
  #start{position:absolute;inset:0;background:linear-gradient(#7fd0f0,#d9f4ff 65%,#9be08f);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3b4b5b}
  #start h1{font-size:56px;margin:0 0 6px;color:#fff;text-shadow:3px 3px 0 #e8802a,-2px -2px 0 #8a4a10,0 4px 0 #8a4a10}
  #start p{font-size:15px;line-height:1.7;margin:3px}
  #start .btn{font-size:21px;padding:8px 36px;margin-top:16px}
  /* ===== 모바일 인터페이스: html.mob(모바일 레이아웃) / html.touch(터치 조작 UI) 일 때만 적용된다. PC 화면은 그대로다. ===== */
  html,body{overscroll-behavior:none}
  #touch,#mobcap,#mobmenu{display:none}
  .touch.playing #touch{display:block}
  .mob #game{position:fixed!important;left:0!important;top:0!important;width:var(--vw)!important;height:var(--vh)!important;transform:none!important;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .mob #cv{position:absolute;left:0;top:0;max-width:none}
  .mob #hint{display:none}
  .mob .pill{font-size:12px;padding:2px 10px;border-width:2px}
  .mob #coin{left:max(8px,env(safe-area-inset-left));top:max(6px,env(safe-area-inset-top))}
  .mob #clock{right:max(8px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top))}
  .mob #cap{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 8px);font-size:15px;padding:8px 12px}
  .mob #skip{top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));min-height:40px}
  .mob #netpill{left:max(8px,env(safe-area-inset-left));top:calc(max(6px,env(safe-area-inset-top)) + 26px);font-size:11px}
  .mob #raidhud{top:calc(max(6px,env(safe-area-inset-top)) + 26px);font-size:11px}
  .inplaza #mobemo{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  #mobemo button{flex:1 0 20%;min-height:44px;font-size:22px;background:#fff4d2;border:2px solid #9b6b43;border-radius:10px}
  .mob #track{right:max(8px,env(safe-area-inset-right));top:calc(max(6px,env(safe-area-inset-top)) + 30px);max-width:min(58vw,300px);font-size:12px}
  .mob #toast{top:calc(max(6px,env(safe-area-inset-top)) + 34px);max-width:88vw;font-size:13px;z-index:40}
  .mob #dlg{left:8px;right:8px;bottom:calc(var(--ctrl) + 8px);padding:16px 16px 10px;z-index:20;touch-action:manipulation}
  .mob #dtxt{font-size:16px;line-height:1.55;min-height:44px;max-height:calc(var(--vh) - var(--ctrl) - 150px);overflow-y:auto;overscroll-behavior:contain}
  .mob #dopts{max-height:calc(var(--vh) - var(--ctrl) - 150px);overflow-y:auto;overscroll-behavior:contain}
  .mob .opt{font-size:16px;padding:10px 12px;margin:4px 0}
  .mob #win{z-index:30;width:min(calc(var(--vw) - 12px),640px)!important;max-height:calc(var(--vh) - 12px)}
  .mob #wb{max-height:calc(var(--vh) - 12px - 58px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;font-size:15px;padding:10px 12px}
  .mob #whd{padding:6px 10px 6px 14px}
  .mob #wx{min-width:46px;min-height:46px;font-size:20px}
  .mob .btn{min-height:44px;font-size:15px;padding:6px 14px}
  .mob .btn.sm{min-width:46px;padding:6px 12px}
  .mob .grid{grid-template-columns:repeat(4,1fr)}
  .mob .cell{padding:8px 2px}
  .mob .rec{flex-wrap:wrap}
  .mob input[type=range]{width:100%;min-width:140px;height:34px}
  .mob #wb canvas{max-width:100%;height:auto}
  .mob .bar span{width:76px}.mob .bar b{width:96px;font-size:12px}
  .mob #start h1{font-size:36px}.mob #start p{font-size:13px;padding:0 14px}.mob #start .btn{font-size:20px;min-height:52px;padding:8px 30px}
  .portrait{--pad:150px;--act:96px}
  .landscape{--pad:min(34vh,140px);--act:min(24vh,92px)}
  #touch{position:absolute;inset:0;z-index:10;pointer-events:none;touch-action:none}
  .touch.portrait.playing #touch::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--ctrl);background:linear-gradient(#26343a,#1b2a2e);border-top:3px solid #9b6b43}
  #touch .ctl{position:absolute;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;transition:transform .05s}
  #touch .ctl.down{transform:scale(.93);filter:brightness(1.12)}
  #pad{width:var(--pad);height:var(--pad);border-radius:50%;background:rgba(255,251,234,.2);border:3px solid rgba(255,251,234,.55);left:calc(max(14px,env(safe-area-inset-left)) + 6px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 14px)}
  .landscape #pad{opacity:.8}
  #pad i{position:absolute;font-style:normal;font-size:22px;color:rgba(255,255,255,.75);width:30px;height:30px;line-height:30px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #pad i.on{color:#ffd36b}
  #pad i[data-d=U]{left:calc(50% - 15px);top:4px}#pad i[data-d=D]{left:calc(50% - 15px);bottom:4px}
  #pad i[data-d=L]{left:4px;top:calc(50% - 15px)}#pad i[data-d=R]{right:4px;top:calc(50% - 15px)}
  #padknob{position:absolute;left:calc(50% - 22px);top:calc(50% - 22px);width:44px;height:44px;border-radius:50%;background:rgba(255,211,107,.8);border:3px solid #b8832a;pointer-events:none}
  #bAct{width:var(--act);height:var(--act);border-radius:50%;background:rgba(255,211,107,.9);border:4px solid #b8832a;color:#6a3a10;font:bold 20px/var(--act) "Malgun Gothic",sans-serif;text-align:center;right:calc(max(16px,env(safe-area-inset-right)) + 8px);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 14px)}
  #bBag,#bMenu{width:60px;height:60px;border-radius:50%;background:rgba(255,251,234,.9);border:3px solid #9b6b43;color:#4a3326;font-size:22px;line-height:34px;text-align:center}
  #bBag small,#bMenu small{display:block;font-size:11px;line-height:12px;margin-top:-2px}
  #bBag{right:calc(max(16px,env(safe-area-inset-right)) + var(--act) + 22px);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 14px)}
  #bMenu{right:calc(max(16px,env(safe-area-inset-right)) + 8px);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 14px + var(--act) + 14px)}
  .landscape.ui-busy #pad,.landscape.ui-busy #bBag,.landscape.ui-busy #bMenu{opacity:0;pointer-events:none}
  .landscape #dlg{right:calc(var(--act) + 44px)}
  .landscape #bAct{z-index:25}
  .touch.playing #mobcap:not(:empty){display:block}
  #mobcap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--ctrl) + 12px);z-index:11;pointer-events:none;background:rgba(255,251,234,.94);border:3px solid #9b6b43;border-radius:14px;padding:3px 12px;font:bold 13px "Malgun Gothic",sans-serif;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
  .ui-busy #mobcap{display:none!important}
  #mobmenu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;width:min(78vw,300px);background:#fffbea;border:4px solid #9b6b43;border-radius:18px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
  #mobmenu.open{display:block}
  #mobmenu .btn{display:block;width:100%;margin:6px 0;min-height:50px;font-size:17px;text-align:left}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv" width="960" height="600"></canvas>
  <div id="coin" class="pill">🪙 0</div>
  <div id="clock" class="pill">1일차 오전 8:00</div>
  <div id="track" class="pill"></div>
  <div id="netpill" class="pill"></div>
  <div id="raidhud" class="pill"></div>
  <div id="hint" class="pill">방향키/WASD 이동 · E 상호작용 · I 보관함 · Q 일지 · M 지도 · H 도움말</div>
  <div id="toast"></div>
  <div id="cap"></div>
  <button id="skip" type="button">건너뛰기 ⏭</button>
  <div id="dlg"><div id="dwho"></div><div id="dtxt"></div><div id="dopts"></div><div id="dnext">▼</div></div>
  <div id="win"><div id="whd"><span id="wt"></span><button id="wx">✕</button></div><div id="wb"></div></div>
  <div id="start">
    <h1>화학 섬 이야기</h1>
    <p>작은 섬에 도착한 새 연구원! 재료를 모으고, 물건을 만들고, 돌턴 박사와 함께 화학을 실험하며 섬을 가꿔 보세요.</p>
    <p>이동 방향키/WASD · 상호작용 E(Space) · 보관함 I · 일지 Q · 지도 M</p>
    <div id="smain">
      <button class="btn" id="bnew">새로 시작</button>
      <button class="btn" id="bcont" style="display:none">이어하기</button>
    </div>
    <div id="setup">
      <p><b>신입 연구원 등록</b><br>광장에서 다른 사람에게 보이는 이름(8자까지)과 셔츠 색을 정해 주세요.<br>본명 대신 별명을 추천해요.</p>
      <input id="snick" maxlength="8" placeholder="이름" autocomplete="off">
      <div id="sshirts"></div>
      <div id="smsg"></div>
      <button class="btn" id="bgo">입소하기</button>
      <button class="btn" id="bback">뒤로</button>
    </div>
  </div>
  <div id="touch">
    <div id="pad" class="ctl"><i data-d="U">▲</i><i data-d="D">▼</i><i data-d="L">◀</i><i data-d="R">▶</i><b id="padknob"></b></div>
    <div id="bAct" class="ctl">행동</div>
    <div id="bBag" class="ctl">🎒<small>가방</small></div>
    <div id="bMenu" class="ctl">☰<small>메뉴</small></div>
  </div>
  <div id="mobcap"></div>
  <div id="mobmenu">
    <div id="mobemo"><button data-m="Digit1">👋</button><button data-m="Digit2">😀</button><button data-m="Digit3">😮</button><button data-m="Digit4">👍</button><button data-m="Digit5">❤️</button><button data-m="Digit6">🔥</button><button data-m="Digit7">🧪</button><button data-m="Digit8">❓</button></div>
    <button class="btn" data-m="KeyQ">📖 연구 일지 (퀘스트·도감)</button>
    <button class="btn" data-m="KeyM">🗺️ 섬 지도</button>
    <button class="btn" data-m="KeyH">❓ 도움말</button>
    <button class="btn" data-m="save">💾 저장하기</button>
    <button class="btn" data-m="full">⛶ 전체 화면 켜기/끄기</button>
    <button class="btn" data-m="close">닫기</button>
  </div>
</div>

<script src="assets/manifest.js" onerror="window.SPR_MISSING=true"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const VW=320,VH=200,SC=3,MW=72,MH=52;
const cv=$("cv"),ctx=cv.getContext("2d");
const wc=document.createElement("canvas");wc.width=VW;wc.height=VH;
const g=wc.getContext("2d");
const FONT="'Malgun Gothic','Nanum Gothic',sans-serif";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f2=n=>(Math.round(n*100)/100).toFixed(2);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= 데이터 =================
const ITEMS={
 water:{n:"물",e:"💧",p:2,d:"강가에서 떠 온 맑은 물. 용액의 용매가 된다."},
 sugar:{n:"설탕",e:"🍬",p:3,d:"사탕수수에서 얻은 설탕. 물에 녹는 비휘발성 용질(분자 물질)."},
 salt:{n:"소금(NaCl)",e:"🧂",p:3,d:"바닷가 소금 바위에서 얻었다. 물에서 Na⁺과 Cl⁻로 나뉜다."},
 ice:{n:"얼음",e:"🧊",p:4,d:"얼음 연못에서 얻은 얼음. 물에 둥둥 뜬다."},
 sand:{n:"모래",e:"🏖️",p:1,d:"해변에서 판 고운 모래. 유리병의 재료."},
 stick:{n:"나뭇가지",e:"🪵",p:2,d:"나무를 흔들면 떨어진다. 제작 재료."},
 flower:{n:"꽃",e:"🌼",p:4,d:"풀밭에서 꺾은 예쁜 꽃."},
 notefrag:{n:"노트 조각",e:"📄",p:3,d:"섬 곳곳에 흩어진 연구 기록 조각. 3장을 모으면 노트가 된다."},

function solData(solute,n){
  const i=solute==="salt"?2:1,mol=n*.1,part=mol*i,m=part/.1;
  const dTb=.512*m,nw=100/18.015,X=part/(part+nw);

}

const hh=(a,b,c=0)=>{let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263)^Math.imul(c|0,2147483647);h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0};
const _sh={};
function shade(c,f){const k=c+f;if(_sh[k])return _sh[k];const n=parseInt(c.slice(1),16),m=f<0?0:255,a=Math.abs(f);
  const ch=v=>Math.round(v+(m-v)*a);return _sh[k]="#"+((1<<24)|(ch(n>>16)<<16)|(ch((n>>8)&255)<<8)|ch(n&255)).toString(16).slice(1)}
const isWaterish=t=>t===0||t===4||t===7;
const SIDE=[[0,-1],[0,1],[-1,0],[1,0]];
let GROUND=null,SHORE=null;
const DEEP=[];for(let d=0;d<=8;d++)DEEP[d]=`rgba(20,80,150,${Math.min(.3,Math.max(0,(d-2)*.07)).toFixed(2)})`;
const FOAM1="rgba(255,255,255,.92)",FOAM2="rgba(255,255,255,.4)";
function buildTilesV2(){
  const rnd=mulberry(77);
  const sp=(x,c,n,s=1)=>{x.fillStyle=c;for(let i=0;i<n;i++)x.fillRect((rnd()*(16-s))|0,(rnd()*(16-s))|0,s,s)};
  const blades=(x,c,n)=>{x.fillStyle=c;for(let i=0;i<n;i++){const a=((rnd()*12)|0)+2,b=((rnd()*10)|0)+4;x.fillRect(a,b,1,2);x.fillRect(a+1,b-1,1,2)}};
  const base=(c,fn)=>mk(16,16,x=>{x.fillStyle=c;x.fillRect(0,0,16,16);fn&&fn(x)});
  const G=[["#8bd873","#7ac962","#a3eb8b"],["#86d46f","#76c45f","#9fe787"],["#8fdc77","#7fcd66","#abee93"],["#84d26d","#72c25b","#9be384"],
           ["#93e07b","#82d06a","#b0f29a"],["#8cdb74","#7bcb63","#a6ec8e"],["#97e37f","#86d36d","#b4f49e"],["#90de78","#7fcf66","#ace994"]];
  TILE.grass=G.map(c=>base(c[0],x=>{sp(x,c[1],9);sp(x,c[2],5);blades(x,c[1],2)}));

  TILE.path=[0,1,2].map(()=>base("#dfbf8f",x=>{sp(x,"#cfa876",6);sp(x,"#ecd3a8",4)}));
  TILE.pathC=[0,1,2].map(()=>base("#e6c99a",x=>{sp(x,"#d8b685",5);sp(x,"#f2dcb4",5);sp(x,"#c9a272",2)}));
  TILE.plaza2=base("#e8e2d2",x=>{x.fillStyle="#d3ccb8";x.fillRect(0,7,16,1);x.fillRect(7,0,1,16);x.fillStyle="#f4efe2";x.fillRect(1,1,5,1);x.fillRect(9,9,5,1)});
  TILE.deck2=base("#d29d64",x=>{x.fillStyle="#a8743f";for(let i=3;i<16;i+=4)x.fillRect(0,i,16,1);x.fillStyle="#e2b282";x.fillRect(6,1,5,1);x.fillRect(1,5,5,1);x.fillRect(8,13,6,1);x.fillStyle="#8a5a30";x.fillRect(2,2,1,1);x.fillRect(13,10,1,1)});
  const wave=(col,hi,lo)=>[0,1,2,3].map(v=>[0,1,2,3].map(f=>base(col,x=>{for(let k=0;k<3;k++){x.fillStyle=k===1?lo:hi;x.fillRect((f*3+k*5+v*4)%12,(2+k*5+v*3)%15,4+(k%2)*2,1)}})));
  TILE.sea=wave("#5ac3e3","#8fdcf0","#4aaed0");TILE.river=wave("#6fd0ea","#a6e6f5","#5cbcd8");

const NAT={1:1,3:2,6:2.5,2:3};
const FRI={2:["#8bd873","#68b856"],6:["#f6faff","#d3e4f4"],3:["#dfbf8f","#c6a06c"]};
const BANK={1:["#e6d193","#cbb273"],2:["#7fc261","#7d6240"],3:["#cfa876","#96764a"],6:["#dcebfa","#9ec6e0"],8:["#cdc6b2","#8a8470"],9:["#a8743f","#6a4424"]};
function edgePx(tx,ty,s,i,k){return s===0?[tx*16+i,ty*16+k]:s===1?[tx*16+i,ty*16+15-k]:s===2?[tx*16+k,ty*16+i]:[tx*16+15-k,ty*16+i]}
function buildGround(){
  const c2=document.createElement("canvas");c2.width=MW*16;c2.height=MH*16;const x=c2.getContext("2d");
  const px=(a,b,col)=>{x.fillStyle=col;x.fillRect(a,b,1,1)};
  const nT=(tx,ty,s)=>tileAt(tx+SIDE[s][0],ty+SIDE[s][1]);
  // 1) 바닥 (물·다리는 동적 렌더링이므로 제외)
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const t=OUT.tiles[ti(tx,ty)];if(!landT(t))continue;const h=hh(tx,ty);let im;
    if(t===1)im=TILE.sand[h%4];
    else if(t===2)im=TILE.grass[SPR.ok?h%TILE.grass.length:(Math.sin(tx*.21+ty*.17)+Math.sin(tx*.07-ty*.11)>0?4:0)+h%4];
    else if(t===3){const p=n=>n===3||n===5;im=p(tileAt(tx-1,ty))&&p(tileAt(tx+1,ty))&&p(tileAt(tx,ty-1))&&p(tileAt(tx,ty+1))?TILE.pathC[h%3]:TILE.path[h%3]}
    else if(t===6)im=TILE.snow[h%4];
    else if(t===8)im=h%2?TILE.plaza2:TILE.plaza;
    else im=h%2?TILE.deck2:TILE.deck;
    x.drawImage(im,tx*16,ty*16);
  }
  if(SPR.ok)grassTone(x);
  // 2) 경계: 자연 지형은 높은 순위가 낮은 순위로 번지고, 물가·광장·데크는 가장자리 처리
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const t=OUT.tiles[ti(tx,ty)];if(!landT(t))continue;const ra=NAT[t];
    if(ra!==undefined){
      for(let s=0;s<4;s++){const nb=nT(tx,ty,s),rb=NAT[nb];if(rb===undefined||rb<=ra)continue;const fr=FRI[nb],line=s===0?ty:s===1?ty+1:s===2?tx:tx+1;
        for(let i=0;i<16;i++){const ga=s<2?tx*16+i:ty*16+i,d=SPR.ok?1+Math.floor(vn1(ga*.3+line*5.1,9)*2.99):1+hh(ga,line,s>>1)%3;for(let k=0;k<d;k++){const p=edgePx(tx,ty,s,i,k);px(p[0],p[1],k===d-1?fr[1]:fr[0])}}}
      for(const[dx,dy]of[[-1,-1],[1,-1],[-1,1],[1,1]]){const rb=NAT[tileAt(tx+dx,ty+dy)];if(rb===undefined||rb<=ra)continue;
        if((NAT[tileAt(tx+dx,ty)]||0)>ra||(NAT[tileAt(tx,ty+dy)]||0)>ra)continue;
        const fr=FRI[tileAt(tx+dx,ty+dy)],cx=tx*16+(dx<0?0:15),cy=ty*16+(dy<0?0:15);px(cx,cy,fr[1]);px(cx-dx,cy,fr[0]);px(cx,cy-dy,fr[0])}
    }
    for(let s=0;s<4;s++){const nb=nT(tx,ty,s),line=s===0?ty:s===1?ty+1:s===2?tx:tx+1;
      if(isWaterish(nb)){const col=BANK[t];
        for(let i=0;i<16;i++){const ga=s<2?tx*16+i:ty*16+i,d=1+hh(ga,line,9+s)%2;for(let k=0;k<d;k++){const p=edgePx(tx,ty,s,i,k);px(p[0],p[1],k===0?col[1]:col[0])}}}
      else if((t===8||t===9)&&nb!==t){x.fillStyle=t===8?"#b9b19c":"#8a5a30";
        for(let i=0;i<16;i++){const p=edgePx(tx,ty,s,i,0);x.fillRect(p[0],p[1],1,1)}}
    }
  }
  // 3) 잔디 얼룩과 건물 그림자
  for(let ty=1;ty<MH-1;ty++)for(let tx=1;tx<MW-1;tx++){
    if(OUT.tiles[ti(tx,ty)]!==2||hh(tx,ty,5)%17!==0)continue;
    x.fillStyle="#9be784";x.fillRect(tx*16+3+hh(tx,ty,6)%4,ty*16+4+hh(tx,ty,7)%5,6,3);x.fillStyle="#7bc965";x.fillRect(tx*16+5+hh(tx,ty,8)%5,ty*16+9+hh(tx,ty,9)%4,4,1)}
  x.fillStyle="rgba(40,70,50,.2)";
  for(const b of BLD){x.fillRect(b.tx*16+84,b.ty*16+12,8,54);x.fillRect(b.tx*16+8,b.ty*16+64,80,3)}
  if(SPR.ok)bakeExtras(x);
  GROUND=c2;
  // 해안으로부터의 거리: 먼 바다일수록 더 짙게 그리기 위한 렌더링 전용 값
  SHORE=new Uint8Array(MW*MH).fill(99);const q=[];
  for(let i=0;i<MW*MH;i++)if(OUT.tiles[i]!==0){SHORE[i]=0;q.push(i)}
  for(let h=0;h<q.length;h++){const c=q[h],cx=c%MW,cy=(c/MW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const n=ti(nx,ny);if(SHORE[n]===99){SHORE[n]=SHORE[c]+1;q.push(n)}}}
}
// 동적 타일: 물(바다·강·연못)과 다리. 물결 프레임과 해금 상태(S.unlock.bridge)에 따라 매 프레임 그린다.
function drawWaterTile(tx,ty,fr,cx,cy){
  const t=OUT.tiles[ti(tx,ty)],x=tx*16-cx,y=ty*16-cy,h=hh(tx,ty);
  if(t===5){

function buildDecor(){
  DECOR=[];
  const free=(tx,ty)=>inb(tx,ty)&&!OUT.occ[ti(tx,ty)]&&!OUT.res[ti(tx,ty)];
  const trees=new Set(OUT.objs.filter(o=>o.k==="tree").map(o=>o.tx+","+o.ty));
  const near=(tx,ty,r)=>{let n=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(trees.has((tx+dx)+","+(ty+dy)))n++;return n};
  for(let ty=1;ty<MH-1;ty++)for(let tx=1;tx<MW-1;tx++){
    const t=OUT.tiles[ti(tx,ty)],h=hh(tx,ty,41);
    if(t===T.GRASS&&free(tx,ty)){
      const nt=near(tx,ty,2);
      if(nt<=1&&h%9===0){const cols=tx<36?["pink","yellow","white"]:["purple","blue","white"];
        for(let k=0;k<2+(h>>>4)%2;k++)DECOR.push({k:"fl",s:(h>>>(9+k))&1,c:cols[(h>>>(3+k))%3],x:tx*16+((h>>>(5+k*3))%7),y:ty*16+((h>>>(7+k*2))%5),tx,ty})}
      else if(nt>=3&&h%13===0)DECOR.push({k:"fern",x:tx*16+1,y:ty*16+6,tx,ty});
    }else if(t===T.RIVER){
      const bank=[0,1,2,3].some(s=>landT(tileAt(tx+SIDE[s][0],ty+SIDE[s][1])));
      if(bank&&h%5===0)DECOR.push({k:"reed",x:tx*16+3,y:ty*16,tx,ty});
      else if(!bank&&h%11===0)DECOR.push({k:"lily",v:(h>>>4)%2,x:tx*16+2,y:ty*16+4,tx,ty,ph:h%628/100});
    }else if(t===T.WATER){
      const d=SHORE[ti(tx,ty)];
      if(d>=2&&d<=5&&h%61===0)DECOR.push({k:"wrock",x:tx*16+2,y:ty*16+4,tx,ty});
    }
  }
}

function blockedOut(tx,ty){
  if(!inb(tx,ty))return true;
  const t=OUT.tiles[ti(tx,ty)];
  if(!landT(t)&&!(t===T.BRIDGE&&S.unlock.bridge))return true;
  if(OUT.solid[ti(tx,ty)])return true;
  for(const d of OUT.doors)if(d.tx===tx&&d.ty===ty&&lockedD(d))return true;
  for(const p of S.placed)if(p.tx===tx&&p.ty===ty)return true;
  return false;
}
function blockedT(tx,ty){
  if(scene==="plaza")return blockedPlaza(tx,ty);
  if(scene==="out")return blockedOut(tx,ty);
  if(tx<0||ty<0||tx>=CUR.w||ty>=CUR.h)return true;
  return !!CUR.solid[ty*CUR.w+tx];
}
const boxHit=(x,y)=>blockedT(Math.floor((x-4)/16),Math.floor((y-4)/16))||blockedT(Math.floor((x+3)/16),Math.floor((y-4)/16))||blockedT(Math.floor((x-4)/16),Math.floor(y/16))||blockedT(Math.floor((x+3)/16),Math.floor(y/16));
const DV=[[0,1],[-1,0],[1,0],[0,-1]];
const keys={};
function movePlayer(dt){
  let ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ay=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  P.moving=!!(ax||ay);
  if(!P.moving)return;
  if(ax&&ay){ax*=.7071;ay*=.7071}
  if(Math.abs(ax)>=Math.abs(ay))P.dir=ax>0?2:1;else P.dir=ay>0?0:3;
  const sp=66*dt;
  let nx=P.x+ax*sp;if(!boxHit(nx,P.y))P.x=nx;
  let ny=P.y+ay*sp;if(!boxHit(P.x,ny))P.y=ny;
  P.t+=dt*9;P.fr=Math.floor(P.t)%4;
}

const SPOTS=[[13,23],[24,21],[19,17],[31,17],[26,30],[16,34],[14,22]];
const SPOTS_E=[[50,21],[53,28],[41,20],[52,33]];
function bfs(sx,sy,gx,gy){
  if(blockedOut(gx,gy))return null;
  const prev=new Int32Array(MW*MH).fill(-1),q=[ti(sx,sy)];prev[q[0]]=q[0];
  const doorSet=new Set(OUT.doors.map(d=>ti(d.tx,d.ty)));
  for(let h=0;h<q.length;h++){const c=q[h],cx=c%MW,cy=(c/MW)|0;if(cx===gx&&cy===gy)break;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const n=ti(nx,ny);if(prev[n]!==-1||blockedOut(nx,ny)||doorSet.has(n))continue;prev[n]=c;q.push(n)}}
  const goal=ti(gx,gy);if(prev[goal]===-1)return null;
  const path=[];for(let c=goal;c!==ti(sx,sy);c=prev[c])path.push([c%MW,(c/MW)|0]);return path.reverse();
}
function updateDalton(dt){
  const near=scene==="out"&&Math.hypot(P.x-D.x,P.y-D.y)<34;
  D.moving=false;
  if(dl||near){if(near){const dx=P.x-D.x,dy=P.y-D.y;D.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:1):(dy>0?0:3)}return}
  if(!S.flags.met)return;
  if(!D.path.length){D.wait-=dt;if(D.wait<=0){
    const pool=SPOTS.concat(S.unlock.bridge?SPOTS_E:[]);
    for(let k=0;k<4;k++){const s=pool[Math.floor(Math.random()*pool.length)];const p=bfs(Math.floor(D.x/16),Math.floor(D.y/16),s[0],s[1]);if(p&&p.length){D.path=p;break}}
    D.wait=3+Math.random()*5}return}
  const[tx,ty]=D.path[0],gx=tx*16+8,gy=ty*16+12,dx=gx-D.x,dy=gy-D.y,d=Math.hypot(dx,dy);
  if(d<1.5){D.path.shift();return}
  const sp=34*dt;D.x+=dx/d*sp;D.y+=dy/d*sp;D.moving=true;D.t+=dt*7;D.fr=Math.floor(D.t)%4;
  D.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:1):(dy>0?0:3);
}

}

async function talkDalton(){

  if(c===0)await questFlow();else if(c===1)await hintFlow();else if(c===2)await chemChat();
  else await say(DN,"그래, 좋은 하루 보내렴!");
}
async function questFlow(){
  const id=QORDER.find(i=>S.q[i]!=="done");
  if(!id){await say(DN,"내가 줄 수 있는 연구 과제는 모두 끝났어! 이벤트 광장의 도전 과제도 한 번 구경해 보렴.");return}
  const Q=QUESTS[id];
  if(!S.q[id]){
    for(const l of Q.offer)await say(DN,l);
    const c=await ask(DN,`퀘스트 「${Q.title}」, 맡아 줄래?`,["네, 맡겨 주세요!","조금 있다가요."]);
    if(c===0){S.q[id]="active";if(Q.onAccept)await Q.onAccept();await say(DN,Q.accepted);toast(`📜 퀘스트 시작: ${Q.title}`);save()}
    else await say(DN,"그래, 준비되면 다시 말을 걸렴.");
    return;
  }
  const left=Q.steps.filter(s=>!s.ok());
  if(left.length){await say(DN,`「${Q.title}」 남은 일이야:\n`+left.map(s=>"• "+s.t).join("\n"));return}
  await say(DN,Q.say);
  for(const z of Q.quiz)await runQuiz(z);
  if(Q.consume)for(const k in Q.consume)take(k,Q.consume[k]);
  S.q[id]="done";
  const lines=Q.reward();
  await say("",`🎉 퀘스트 완료: ${Q.title}\n\n`+lines.join("\n"));
  save();
}
async function runQuiz(z){
  const order=shuffle(z.o.map((_,i)=>i));
  while(true){
    const s=await ask(DN,z.q(),order.map(i=>z.o[i]));
    if(order[s]===z.a){await say(DN,"정답이야! "+z.why);return}
    await say(DN,"음, 다시 생각해 볼까? 힌트: "+z.hint);
  }
}

const sy={V:8,T:300};
function winSyringe(){
  if(!have("syringe")&&!S.flags.syrMade){openWin("💉 기체 주사기 실험대",b=>b.append(el("div","note","주사기 모형이 필요해요. 제작대에서 만들어 보세요! (돌턴의 퀘스트에서 제작법을 배워요)")));return}
  openWin("💉 기체 주사기 실험대",b=>{
    const n=.2;
    b.append(el("div","note",`주사기 안에는 기체 ${n} mol이 들어 있어요. 부피(V)와 온도(T)를 조절하며 압력(P)을 관찰하고, 측정 기록으로 남겨요. 이상 기체: P = nRT / V (R = 0.0821 atm·L/mol·K)`));
    const vv=el("div","row"),tt=el("div","row"),out=el("div","note"),cvs=el("canvas");cvs.width=520;cvs.height=190;
    const vs=el("input");vs.type="range";vs.min=1;vs.max=10;vs.step=.5;vs.value=sy.V;
    const ts=el("input");ts.type="range";ts.min=250;ts.max=400;ts.step=10;ts.value=sy.T;
    const vl=el("b"),tl=el("b");
    vv.append(el("span","","부피 V"),vs,vl);tt.append(el("span","","온도 T"),ts,tl);
    const tableBox=el("div");
    function table(){tableBox.innerHTML="";if(!S.lab.gas.length)return;tableBox.append(el("div","sub","📋 측정 기록"),el("div","",
      `<table><tr><th>V (L)</th><th>T (K)</th><th>P (atm)</th><th>P×V</th><th>P/T</th></tr>`+S.lab.gas.slice(-8).map(r=>`<tr><td>${r.V}</td><td>${r.T}</td><td>${f2(r.P)}</td><td>${f2(r.P*r.V)}</td><td>${(r.P/r.T*1000).toFixed(2)}e-3</td></tr>`).join("")+`</table>`))}
    function upd(){
      sy.V=+vs.value;sy.T=+ts.value;vl.textContent=`${sy.V} L`;tl.textContent=`${sy.T} K`;
      const P=gasP(n,sy.T,sy.V);out.innerHTML=`현재 압력 <b>P = ${f2(P)} atm</b>　(P×V = ${f2(P*sy.V)}, P/T = ${(P/sy.T*1000).toFixed(2)}e-3)`;
      const c2=cvs.getContext("2d");c2.clearRect(0,0,520,190);c2.fillStyle="#fff";c2.fillRect(0,0,520,190);
      const X=v=>40+(v-1)/9*460,Y=p=>170-p/7*150;
      c2.strokeStyle="#bbb";c2.fillStyle="#666";c2.font="11px sans-serif";c2.lineWidth=1;
      for(let p=0;p<=6;p+=2){c2.beginPath();c2.moveTo(40,Y(p));c2.lineTo(500,Y(p));c2.stroke();c2.fillText(p+" atm",4,Y(p)+4)}
      for(let v=1;v<=10;v+=1)c2.fillText(v,X(v)-3,185);
      c2.strokeStyle="#e8804a";c2.lineWidth=2;c2.beginPath();for(let v=1;v<=10;v+=.25){const p=gasP(n,sy.T,v);v===1?c2.moveTo(X(v),Y(p)):c2.lineTo(X(v),Y(p))}c2.stroke();
      for(const r of S.lab.gas){c2.fillStyle=r.T===sy.T?"#4a7ee0":"#9aa";c2.beginPath();c2.arc(X(r.V),Y(r.P),4,0,7);c2.fill()}
      c2.fillStyle="#d03a3a";c2.beginPath();c2.arc(X(sy.V),Y(P),6,0,7);c2.fill();
    }
    vs.oninput=upd;ts.oninput=upd;
    const rec=el("button","btn","📝 측정 기록");rec.onclick=()=>{const P=gasP(n,sy.T,sy.V);S.lab.gas.push({V:sy.V,T:sy.T,P});if(S.lab.gas.length>40)S.lab.gas.shift();toast("측정값을 기록했어요.");table();upd()};
    b.append(vv,tt,out,cvs,el("div","note","주황 곡선: 현재 온도에서 부피에 따른 압력. 파란 점: 같은 온도에서 기록한 값."),rec,tableBox);
    table();upd();
  },600);
}

// ---------- 백엔드 1: 연습 모드(같은 브라우저 탭끼리) ----------
function makeLocalBackend(){
  const id="L"+Math.random().toString(36).slice(2,10);
  let bc=null;try{bc=new BroadcastChannel("chemisle_plaza_v1")}catch(e){}
  let tree={};const subs=new Set(),disc=[];
  const keys=p=>String(p).split("/").filter(Boolean),norm=p=>keys(p).join("/");
  const clone=v=>v===null||v===undefined?null:JSON.parse(JSON.stringify(v));
  const prune=o=>{for(const k of Object.keys(o)){const v=o[k];if(v&&typeof v==="object"){prune(v);if(!Object.keys(v).length)delete o[k]}else if(v===null||v===undefined)delete o[k]}};
  const getAt=p=>{let n=tree;for(const k of keys(p)){if(!n||typeof n!=="object"||!(k in n))return null;n=n[k]}return n};
  function put(p,v){
    const ks=keys(p);if(!ks.length){tree=v&&typeof v==="object"?clone(v):{};return}
    let n=tree;for(let i=0;i<ks.length-1;i++){if(!n[ks[i]]||typeof n[ks[i]]!=="object")n[ks[i]]={};n=n[ks[i]]}
    const last=ks[ks.length-1];if(v===null||v===undefined)delete n[last];else n[last]=clone(v);prune(tree);
  }
  const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==="object"){if(!a[k]||typeof a[k]!=="object")a[k]={};merge(a[k],b[k])}else a[k]=b[k]}};
  const touch=p=>{p=norm(p);for(const s of subs)if(p.startsWith(s.p)||s.p.startsWith(p)){try{s.cb(clone(getAt(s.p)))}catch(e){console.error(e)}}};
  const send=m=>{m.from=id;try{bc&&bc.postMessage(m)}catch(e){}};
  if(bc)bc.onmessage=ev=>{
    const m=ev.data;if(!m||m.from===id)return;
    if(m.op==="hello")send({op:"state",to:m.from,tree});
    else if(m.op==="state"){if(m.to===id){merge(tree,m.tree||{});touch("")}}
    else if(m.op==="set"){put(m.p,m.v);touch(m.p)}
  };
  const set=(p,v)=>{put(p,v);touch(p);send({op:"set",p,v:clone(v)});return Promise.resolve()};
  return{kind:"local",uid:id,auth:id,now:()=>Date.now(),
    set,update:(p,o)=>{for(const k in o)set(p+"/"+k,o[k]);return Promise.resolve()},
    remove:p=>set(p,null),get:async p=>clone(getAt(p)),
    sub:(p,cb)=>{const s={p:norm(p),cb};subs.add(s);setTimeout(()=>{if(subs.has(s))cb(clone(getAt(s.p)))},0);return()=>subs.delete(s)},
    onDisc:p=>{disc.push(p)},
    close:()=>{for(const p of disc)set(p,null)},
    hello:()=>send({op:"hello"})};
}
// ---------- 백엔드 2: Firebase Realtime Database ----------
async function makeFirebaseBackend(cfg){
  const A=await import(FB_CDN+"firebase-app.js"),AU=await import(FB_CDN+"firebase-auth.js"),DB=await import(FB_CDN+"firebase-database.js");
  const app=A.getApps().length?A.getApp():A.initializeApp(cfg),auth=AU.getAuth(app);
  const cred=await AU.signInAnonymously(auth),db=DB.getDatabase(app);
  // 서버 시각 오프셋: 첫 값이 올 때까지 잠깐 기다린다(최대 3초). 공동 광장 시각이 이 값에 의존한다.
  let off=0;
  const offReady=new Promise(res=>{DB.onValue(DB.ref(db,".info/serverTimeOffset"),s=>{off=s.val()||0;res()})});
  await Promise.race([offReady,new Promise(r=>setTimeout(r,3000))]);
  const R_=p=>DB.ref(db,p),warn=e=>console.warn("광장 쓰기 실패:",e&&e.code||e);
  // 같은 브라우저의 탭은 익명 로그인 UID를 공유한다. 플레이어 ID는 'UID_탭마다 새로 뽑는 문자열'로 탭별로 구분한다.
  const rb=new Uint8Array(6);(self.crypto||{getRandomValues:a=>a.forEach((_,i)=>a[i]=Math.random()*256)}).getRandomValues(rb);
  const sid=Array.from(rb,b=>(b%36).toString(36)).join("");
  return{kind:"firebase",auth:cred.user.uid,uid:cred.user.uid+"_"+sid,now:()=>Date.now()+off,
    set:(p,v)=>DB.set(R_(p),v===undefined?null:v),update:(p,o)=>DB.update(R_(p),o).catch(warn),remove:p=>DB.remove(R_(p)).catch(warn),
    get:async p=>(await DB.get(R_(p))).val(),
    sub:(p,cb)=>DB.onValue(R_(p),s=>cb(s.val())),
    onDisc:p=>{DB.onDisconnect(R_(p)).remove()},
    onConn:cb=>DB.onValue(R_(".info/connected"),s=>cb(!!s.val())),
    close:()=>{}};
}

// ================= 레이드: 폭주하는 솥 골렘 =================
// 1단계 증기 방어막 — 비휘발성 용질을 넣어 용액의 증기 압력을 낮춘다 (증기 압력 내림, 소금은 이온 2개로 계산).
// 2단계 과열 제어   — 압력 밸브로 끓는점을 조절해 열원 온도의 과열(끓어 넘침)을 막는다.
//                     끓는점은 두 가지로 정해진다: 외부 압력(클라우지우스–클라페롱)과 용질(끓는점 오름, ΔTb = i·Kb·m).
//                     끓어 넘침은 끓는점 오름과 다른 현상이다 — 열원 온도가 끓는점을 넘은 과열 상태가 누적되면 일어나는 위험으로 다룬다.
// 3단계 가스 과압   — 목표 분압에 맞게 기체 캡슐을 넣는다 (돌턴의 부분 압력 법칙, P = nRT/V).
// 서버가 없으므로 판정은 '드라이버'(접속 중인 참가자 중 uid가 가장 앞선 사람)의 브라우저가 맡고, 나머지는 같은 데이터를 보고 표시만 한다.
const P1_TIME=150,P2_TIME=45,P2_RISE=40,P2_GRACE=3,P3_TIME=150,CAP1=8,VMAX=5,PBURST=3.0,GOAL_X=.06,RAID_MAX=8;
// dead: 살아 있는 참가자가 없는 채로 흐른 시간(초), ghost: 참가자별로 끊긴 채 흐른 시간, drv: 내가 판정자로 일하는 중인지
// deadAfter/ghostAfter 는 시험할 때 줄여 쓸 수 있도록 값으로 둔다.
// danger: 연출용 위험도(0~1, 부드럽게 따라감), flash: 단계 전환 섬광의 남은 시간(초), flashSt: 전환된 단계
// stab: 2단계 '안정화 진행도'(초): 판정자가 계산해 서버(stab)에 적어 두고 판정자가 바뀌어도 이어진다. msgT: 3단계 안내 문구를 마지막으로 본 시각.
const RD={acc:0,sig:"",last:"",meter:0,done:0,liveFn:null,add:{u:0,a:0},v3:{n2:0,o2:0,he:0},dead:0,ghost:{},drv:false,deadAfter:60,ghostAfter:30,rr:0,danger:0,flash:0,flashSt:"",stab:0,msgT:0};
const GOAL_P=P0*(1-GOAL_X);
const rMem=r=>Object.keys((r&&r.mem)||{});
const isMem=r=>!!(r&&r.mem&&NET.uid&&r.mem[NET.uid]);
const raidPath=()=>`plaza/${NET.ch}/raid`;
// 접속해 있는 참가자: 나 자신이거나, 하트비트가 STALE 안쪽인 사람
const memAlive=(u,now)=>u===NET.uid||!!(NET.players[u]&&now-NET.players[u].t<STALE);
const liveMem=r=>{const now=NET.be.now();return rMem(r).filter(u=>memAlive(u,now))};
function driverUid(r){
  return liveMem(r).sort()[0]||null;
}
const amDriver=r=>driverUid(r)===NET.uid;
// ----- 화학 계산 -----
const potG=N=>100*N;                                  // 솥 속 물의 질량(g)
function p1Sum(r){let u=0,a=0;const o=r.p1||{};for(const k in o){u+=o[k].u|0;a+=o[k].a|0}return{u,a}}
function p1State(r){
  const{u,a}=p1Sum(r),pot=potG(r.N||1),part=(u+a*2)*.1,nw=pot/18.015,X=part/(part+nw);
  return{u,a,part,X,P:P0*(1-X),m:part/(pot/1000),pot};
}
const tbPure=P=>1/(1/373.15-8.314*Math.log(P)/40700)-273.15;   // 클라우지우스–클라페롱, ΔHvap = 40.7 kJ/mol
const tPeak=N=>Math.min(125,102+5*N);
// ----- 2단계 장치: 압력 밸브(각자 0~5칸)와 냉각 펌프(각자, 8초 가동 후 6초 재충전) -----
// 냉각 펌프는 열원 온도만 낮춘다(끓는점 자체는 바꾸지 않는다). 가동 시작 시각(서버 시각)만 기록하고, 가동·재충전은 시각에서 계산한다.
// 압력 밸브와 냉각 펌프가 동시에 가동 중이면 '안정화'가 빨라진다(동조 ×1.5). 서로 다른 사람이 쓰면 더 빨라진다(팀워크 ×2). 혼자서도 두 장치를 함께 쓸 수 있다.
const PUMP_ON=8000,PUMP_CYCLE=14000,PUMP_COOL=3,SYN_MULT=1.5,TEAM_MULT=2;
function pumpState(r,u,now){
  const t0=r.p2c&&r.p2c[u];if(typeof t0!=="number")return{on:false,ready:true,left:0,wait:0};
  const d=now-t0;
  if(d<0)return{on:true,ready:false,left:PUMP_ON/1000,wait:0};
  if(d<PUMP_ON)return{on:true,ready:false,left:(PUMP_ON-d)/1000,wait:0};
  if(d<PUMP_CYCLE)return{on:false,ready:false,left:0,wait:(PUMP_CYCLE-d)/1000};
  return{on:false,ready:true,left:0,wait:0};
}
function p2Devices(r){
  const now=NET.be.now(),v=r.p2||{},vIds=[],pIds=[];
  for(const u of rMem(r)){if(!memAlive(u,now))continue;if((v[u]|0)>0)vIds.push(u);if(pumpState(r,u,now).on)pIds.push(u)}
  const syn=vIds.length>0&&pIds.length>0,team=syn&&vIds.some(a=>pIds.some(b=>a!==b));
  return{valves:vIds.length,pumps:pIds.length,syn,team,mult:team?TEAM_MULT:syn?SYN_MULT:1};
}
function p2State(r,e){
  // 접속이 끊긴 사람의 밸브는 합산에서 뺀다(나간 사람의 압력이 영구히 남지 않도록)
  const N=r.N||1,v=r.p2||{},nowS=NET.be.now();let s=0;for(const k in v)if(memAlive(k,nowS))s+=v[k]|0;
  const dv=p2Devices(r);
  const Pext=1+.1*s,dTb=.512*p1State(r).m,Tb=tbPure(Pext)+dTb;
  const T=Math.max(100,100+(tPeak(N)-100)*clamp((e-P2_GRACE)/P2_RISE,0,1)-PUMP_COOL*dv.pumps);
  return{Pext,Tb,dTb,T,s,pumps:dv.pumps,mult:dv.mult,syn:dv.syn,team:dv.team};
}
const need3=N=>({n2:Math.max(2,Math.ceil(N*.8)),o2:Math.max(1,Math.ceil(N*.4)),he:Math.max(1,Math.floor(N*.4))});
function use3(r){const t={n2:0,o2:0,he:0},o=(r.p3&&r.p3.use)||{};for(const k in o)for(const g_ in t)t[g_]+=o[k][g_]|0;return t}
const GAS=[["n2","질소 N₂","#4a7ee0"],["o2","산소 O₂","#e85a5a"],["he","헬륨 He","#e8b830"]];
// ----- 3단계: 넣기 제안과 함께 넣기(확정) -----
// 각자 '제안'(넣을 캡슐 수)만 적고, 누가 '함께 넣기'를 누르면 판정자가 모든 제안을 한꺼번에 넣는다.
// 확정을 누른 순간의 제안 지문(sig)과 판정 순간의 지문이 다르면(그 사이 누가 제안을 바꿈) 넣지 않고 취소한다 → 동시에 눌러 뜻밖에 넘기는 일이 없다.
const G3=["n2","o2","he"];
function p3Props(r){const o={},pr=(r.p3&&r.p3.prop)||{};for(const u in pr){const p=pr[u]||{};o[u]={n2:p.n2|0,o2:p.o2|0,he:p.he|0}}return o}
function p3Sig(r){const p=p3Props(r);return Object.keys(p).sort().map(k=>`${k}:${p[k].n2},${p[k].o2},${p[k].he}`).join("|")}
function p3Totals(r){const u=use3(r),p=p3Props(r),proj={n2:u.n2,o2:u.o2,he:u.he};for(const k in p)for(const g_ of G3)proj[g_]+=p[k][g_];return{use:u,proj}}

// ----- 연출 전용: 위험도·증기 색·경고 효과 (게임 판정과 서버 데이터는 읽기만 한다) -----
// 위험도는 이미 계산해 두는 값(증기 압력, 과열 누적, 외부 압력, 남은 시간)에서 정한다. 모든 참가자·구경꾼이 같은 값을 본다.
const REDUCE=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);   // 움직임 줄이기 설정이면 흔들림·섬광을 줄인다
const STEAM_K=[[0,[240,248,255]],[.4,[255,236,150]],[.7,[255,160,70]],[1,[236,72,60]]];
function steamRGB(d){d=clamp(d,0,1);for(let i=0;i<STEAM_K.length-1;i++){const a=STEAM_K[i],b=STEAM_K[i+1];if(d<=b[0]){const t=(d-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*t))}}return STEAM_K[3][1]}
function raidDanger(){
  const r=NET.raid;if(!r||!NET.ok||!NET.be)return 0;
  const e=(NET.be.now()-r.t0)/1000;
  if(r.st==="won"||r.st==="lobby")return 0;
  if(r.st==="lost")return 1;
  // 솥 불안정도: 실패 조건에 가까워질수록 오르고, 실패하는 순간(시간 초과·파열·끓어 넘침) 100%가 된다.
  if(r.st==="p1"){const s=p1State(r),prog=clamp(1-(s.P-GOAL_P)/(P0-GOAL_P),0,1),tf=clamp(e/P1_TIME,0,1);return tf>=1?1:clamp(.1+.9*tf*(1-.6*prog),0,1)}   // 시간이 갈수록 오르고, 증기 압력이 목표에 가까울수록 덜 오른다
  if(r.st==="p2"){const s=p2State(r,e);return clamp(Math.max(.08,RD.meter/6,(s.Pext-1.5)/(PBURST-1.5)),0,1)}                                                // 과열 누적이 차오르거나 외부 압력이 파열선(3.0 atm)에 가까울수록 오른다
  if(r.st==="p3")return clamp(.1+.9*clamp(e/P3_TIME,0,1),0,1);
  return .3;
}
function raidFxUpdate(dt){
  RD.danger+=(raidDanger()-RD.danger)*Math.min(1,dt*3);
  if(RD.flash>0)RD.flash=Math.max(0,RD.flash-dt);

// 화면 위 효과(낮밤 색조 위에 얹는다): 솥 주변 빛, 위험할 때 붉은 테두리, 단계 전환 섬광
function plazaRaidFx(){
  const r=NET.raid;if(!r||!NET.ok)return;
  const st=r.st,act=st==="p1"||st==="p2"||st==="p3",d=RD.danger,t=time;
  const gx=Math.round(22*16+32-cam.x),gy=Math.round(11*16+24-cam.y);
  const fd=(cx,cy,rr)=>{for(let dy=-rr;dy<=rr;dy++){const w=Math.floor(Math.sqrt(rr*rr+rr*.8-dy*dy));g.fillRect(cx-w,cy+dy,w*2+1,1)}};
  if(act||st==="lobby"||st==="won"){
    const[sr,sg,sb]=steamRGB(act?d:0),k=act?.05+.09*d:.04;
    g.globalCompositeOperation="lighter";
    for(const[rr,al]of[[46,.4],[32,.7],[20,1]]){g.fillStyle=`rgba(${sr},${sg},${sb},${(k*al).toFixed(3)})`;fd(gx,gy,rr)}
    g.globalCompositeOperation="source-over";
  }
  if(act&&d>.55){
    const pulse=REDUCE?.6:.5+.5*Math.sin(t*4),a=(d-.55)/.45*.28*pulse;
    for(let i=0;i<4;i++){g.fillStyle=`rgba(255,40,30,${(a*(1-i*.22)).toFixed(3)})`;const b=i*5;g.fillRect(0,b,VW,5);g.fillRect(0,VH-b-5,VW,5);g.fillRect(b,0,5,VH);g.fillRect(VW-b-5,0,5,VH)}
  }
  if(RD.flash>0&&!REDUCE){
    const f=RD.flash/.9,c={p1:"120,210,240",p2:"255,150,70",p3:"180,140,255",won:"150,240,160",lost:"90,90,100"}[RD.flashSt]||"255,255,255";
    g.fillStyle=`rgba(${c},${(f*f*.35).toFixed(3)})`;g.fillRect(0,0,VW,VH);
  }
}
const RAID_BANNER={p1:"🍲 1단계 — 증기 방어막! 용질로 증기 압력을 낮춰요",p2:"🌡️ 2단계 — 열원이 뜨거워져요! 압력 밸브와 냉각 펌프를 함께 써요",p3:"⚗️ 3단계 — 가스가 차올라요! 제안을 맞추고 함께 넣어요",won:"✨ 솥의 정령이 진정됐어요!",lost:"💥 솥이 불안정해졌어요…"};
function raidLabel(){

// ----- 상태 변경(쓰기) -----
function raidWrite(obj){return NET.be.update(raidPath(),obj)}
function raidOpen(){
  const now=NET.be.now();
  NET.be.set(raidPath(),{seq:now,st:"lobby",t0:now,mem:{[NET.uid]:{n:S.flags.nick||"손님"}}});
}
function raidJoin(){const r=NET.raid;if(!r||r.st!=="lobby"||liveMem(r).length>=RAID_MAX)return;NET.be.set(`${raidPath()}/mem/${NET.uid}`,{n:S.flags.nick||"손님"})}
function raidLeave(){
  const r=NET.raid;if(!r)return;
  // 나 말고 접속해 있는 참가자가 없으면 레이드를 통째로 정리한다(끊긴 사람만 남은 레이드를 만들지 않는다)
  if(liveMem(r).filter(u=>u!==NET.uid).length===0)NET.be.remove(raidPath());else NET.be.remove(`${raidPath()}/mem/${NET.uid}`);
}
// 시작할 때 인원 N 은 접속해 있는 참가자만 센다. 끊긴 참가자는 참가자 목록에서 뺀다(목표와 보상이 부풀려지지 않게).
function raidStart(){
  const r=NET.raid;if(!r||r.st!=="lobby"||!isMem(r))return;
  const live=liveMem(r);
  raidWrite({st:"p1",t0:NET.be.now(),N:Math.max(1,live.length)});
  for(const u of rMem(r))if(!live.includes(u))NET.be.remove(`${raidPath()}/mem/${u}`);
}
function raidLose(why){const r=NET.raid;if(!r||r.st==="won"||r.st==="lost")return;raidWrite({st:"lost",t0:NET.be.now(),why})}
function raidStartP3(r){
  const N=r.N||1,need=need3(N),deck=[];
  for(const g_ in need)for(let i=0;i<need[g_];i++)deck.push(g_);
  for(let i=0;i<2;i++)deck.push(["n2","o2","he"][Math.floor(Math.random()*3)]);   // 함정용 여분 캡슐 2개
  const now=NET.be.now(),ok=rMem(r).filter(u=>u===NET.uid||(NET.players[u]&&now-NET.players[u].t<STALE)).sort(),sup={};
  ok.forEach(u=>sup[u]={n2:0,o2:0,he:0});
  shuffle(deck).forEach((g_,i)=>sup[ok[i%ok.length]][g_]++);
  raidWrite({st:"p3",t0:now,p3:{need,sup,use:null}});
}
// 접속해 있는 참가자가 없어 아무도 판정하지 못하는 레이드를 정리하고, 모집 중에 오래 끊긴 참가자를 뺀다.
// 플레이어 목록이 아직 도착하기 전에는(모두 끊긴 것처럼 보일 수 있으므로) 아무것도 지우지 않는다.
function raidCleanup(r,live,step){
  if(!NET.playersReady){RD.dead=0;return}
  if(live.length===0){
    RD.dead+=step;
    if(RD.dead>=RD.deadAfter&&NET.raid&&NET.raid.seq===r.seq){RD.dead=0;NET.be.remove(raidPath())}
  }else RD.dead=0;
  if(r.st==="lobby"&&isMem(r)){
    for(const u of rMem(r)){
      if(live.includes(u)){delete RD.ghost[u];continue}
      RD.ghost[u]=(RD.ghost[u]||0)+step;
      if(RD.ghost[u]>=RD.ghostAfter){delete RD.ghost[u];NET.be.remove(`${raidPath()}/mem/${u}`)}
    }
  }
}
// 3단계 중에 캡슐을 가진 참가자가 끊기면 남은 캡슐을 접속해 있는 참가자에게 돌려 가며 넘긴다(판정자만 쓴다).
function raidP3Rebalance(r,live){
  if(!r.p3||!r.p3.sup||!live.length)return;
  const sup=r.p3.sup,use=r.p3.use||{},G=["n2","o2","he"],add={};
  for(const u in sup){
    if(live.includes(u))continue;
    const left={};let tot=0;
    for(const k of G){left[k]=Math.max(0,(sup[u][k]|0)-((use[u]&&use[u][k])|0));tot+=left[k]}
    if(tot<=0)continue;
    for(const k of G)for(let i=0;i<left[k];i++){const to=live[RD.rr++%live.length];(add[to]=add[to]||{n2:0,o2:0,he:0})[k]++}
    add[u]=add[u]||{n2:0,o2:0,he:0};add[u].takeBack=left;   // 끊긴 사람의 보유량은 이미 쓴 만큼으로 줄인다
  }
  // 끊긴 사람의 넣기 제안은 지운다(보유 캡슐이 넘어갔으므로 그대로 두면 확정이 계속 취소된다)
  if(r.p3.prop)for(const u in r.p3.prop)if(!live.includes(u))NET.be.remove(`${raidPath()}/p3/prop/${u}`);
  for(const to in add){
    const cur=sup[to]||{n2:0,o2:0,he:0},nx={};
    if(add[to].takeBack){for(const k of G)nx[k]=(cur[k]|0)-add[to].takeBack[k]}
    else for(const k of G)nx[k]=(cur[k]|0)+add[to][k];
    NET.be.set(`${raidPath()}/p3/sup/${to}`,nx);
  }
}
// 3단계 '함께 넣기': 확정 시점의 제안 지문과 지금 제안이 같을 때만, 각자 보유한 캡슐 범위 안에서 모든 제안을 한꺼번에 넣는다(판정자만 쓴다).
function raidP3Commit(r){
  const c=r.p3.commit,base=raidPath()+"/p3";
  const stop=msg=>{NET.be.remove(`${base}/commit`);if(msg)NET.be.set(`${base}/msg`,{t:NET.be.now(),text:msg})};
  if(c.sig!==p3Sig(r)){stop("제안이 바뀌어서 함께 넣기가 취소됐어요. 다시 확인해 주세요.");return}
  const props=p3Props(r),use=r.p3.use||{},sup=r.p3.sup||{},upd={};
  for(const u in props){
    const cur=use[u]||{},own=sup[u]||{};
    for(const g_ of G3)if(props[u][g_]>((own[g_]|0)-(cur[g_]|0))){stop(`${(r.mem&&r.mem[u]&&r.mem[u].n)||"?"}님의 제안이 가진 캡슐보다 많아서 취소됐어요.`);return}
    upd[u]={n2:(cur.n2|0)+props[u].n2,o2:(cur.o2|0)+props[u].o2,he:(cur.he|0)+props[u].he};
  }
  for(const u in upd)NET.be.set(`${base}/use/${u}`,upd[u]);
  for(const u in props)NET.be.remove(`${base}/prop/${u}`);
  NET.be.remove(`${base}/commit`);
}
// ----- 매 프레임 판정 -----
function raidTick(dt){
  // 누적값(과열·안정화·끊김 시간)은 프레임 시간이 아니라 서버 시각의 실제 경과 시간으로 센다. 프레임이 느려도(저사양 기기, 탭이 잠깐 가려졌다 돌아옴) 시간이 어긋나지 않는다.
  const nowT=NET.be.now();
  if(RD.lastT&&nowT-RD.lastT<250)return;
  const step=RD.lastT?clamp((nowT-RD.lastT)/1000,.05,1.5):.25;RD.lastT=nowT;
  const r=NET.raid;
  if(!r){RD.last="";RD.dead=0;return}
  const now=NET.be.now(),e=(now-r.t0)/1000,key=r.seq+":"+r.st,live=liveMem(r);
  // 모집 중인 레이드에 남은 내 이전 접속(새로고침 전 탭) 참가자를 정리한다.
  if(r.st==="lobby"){
    const old=rMem(r).filter(u=>u!==NET.uid&&(u===NET.auth||u.startsWith(NET.auth+"_"))&&!(NET.players[u]&&now-NET.players[u].t<STALE));
    if(old.length){if(old.length===rMem(r).length)NET.be.remove(raidPath());else old.forEach(u=>NET.be.remove(`${raidPath()}/mem/${u}`))}
  }
  raidCleanup(r,live,step);
  if(key!==RD.last){
    // 단계가 바뀌는 순간을 지켜본 경우(처음 들어와서 보는 것이 아닐 때) 섬광과 안내 문구를 보여 준다. 참가자·구경꾼 모두 같다.
    if(RD.last&&RAID_BANNER[r.st]){RD.flash=.9;RD.flashSt=r.st;toast(RAID_BANNER[r.st],3200)}
    RD.last=key;RD.meter=0;RD.stab=0;RD.drv=false;RD.msgT=(r.p3&&r.p3.msg&&r.p3.msg.t)||0;raidOnState(r);
  }
  // 3단계 안내 문구(함께 넣기 취소 등)는 바뀐 것을 처음 본 순간에만 알려 준다
  if(r.st==="p3"&&r.p3&&r.p3.msg&&r.p3.msg.t!==RD.msgT){RD.msgT=r.p3.msg.t;if(isMem(r))toast("⚗️ "+r.p3.msg.text,4200)}
  // 과열 누적: 판정자가 계산해 서버(hot)에 적어 두고, 나머지는 그 값을 읽는다. 판정자가 바뀌어도 거기서 이어 간다.
  if(r.st==="p2"){
    const s=p2State(r,e),hot=s.T>s.Tb;
    if(amDriver(r)){
      if(!RD.drv){RD.drv=true;RD.meter=Math.max(RD.meter,r.hot||0);RD.stab=Math.max(RD.stab,r.stab||0)}
      RD.meter=clamp(RD.meter+(hot?step:-step),0,6);
      RD.stab+=step*s.mult;   // 압력 밸브와 냉각 펌프를 함께 쓰면 안정화가 빨라진다(동조 ×1.5, 서로 다른 사람이면 ×2)
      const w={};
      if(Math.abs((r.hot||0)-RD.meter)>=.4)w.hot=+RD.meter.toFixed(2);
      if(Math.abs((r.stab||0)-RD.stab)>=1)w.stab=+RD.stab.toFixed(1);
      if(w.hot!==undefined||w.stab!==undefined)raidWrite(w);
    }else{RD.drv=false;RD.meter=r.hot||0;RD.stab=r.stab||0}
  }
  if(curWin&&curWin.raid&&RD.liveFn)RD.liveFn();
  if(!amDriver(r))return;
  if(r.st==="p1"){
    if(p1State(r).P<=GOAL_P+1e-9)raidWrite({st:"p2",t0:now,hot:0,stab:0});
    else if(e>P1_TIME)raidLose("제한 시간 안에 증기 압력을 목표까지 낮추지 못했어요.");
  }else if(r.st==="p2"){
    const s=p2State(r,e);
    if(s.Pext>PBURST+1e-9)raidLose(`외부 압력이 ${PBURST.toFixed(1)} atm을 넘어 솥이 터졌어요!`);
    else if(RD.meter>=6)raidLose("열원 온도가 끓는점을 넘은 과열 상태가 너무 오래 이어져 끓어 넘쳤어요!");
    else if(RD.stab>=P2_TIME)raidStartP3(r);   // 안정화 진행도가 가득 차면 3단계로(장치를 함께 쓰면 그만큼 일찍 끝난다)
  }else if(r.st==="p3"&&r.p3&&r.p3.need){
    raidP3Rebalance(r,live);
    if(r.p3.commit){raidP3Commit(r);return}   // 이번 틱에는 넣기만 처리하고, 다음 틱에 갱신된 값으로 승패를 판정한다
    const u=use3(r),n=r.p3.need;
    if(u.n2>n.n2||u.o2>n.o2||u.he>n.he)raidLose("목표 분압을 넘겨서 용기가 과압으로 터졌어요!");
    else if(u.n2===n.n2&&u.o2===n.o2&&u.he===n.he)raidWrite({st:"won",t0:now,why:"세 기체의 분압이 목표와 정확히 맞았어요!"});
    else if(e>P3_TIME)raidLose("제한 시간 안에 목표 분압을 맞추지 못했어요.");
  }else if((r.st==="won"||r.st==="lost")&&e>30)NET.be.remove(raidPath());
  else if(r.st==="lobby"&&e>900)NET.be.remove(raidPath());
}
function netRaid(v){
  NET.raid=v||null;
  const r=NET.raid,sig=r?r.seq+":"+r.st+":"+rMem(r).join(",")+":"+(r.p3&&r.p3.sup?JSON.stringify(r.p3.sup):"")+":"+(r.p3&&r.p3.use?JSON.stringify(r.p3.use):"")+":"+(r.p3&&r.p3.prop&&r.p3.prop[NET.uid]?1:0):"none";   // 내 제안이 생기거나(확정으로) 사라지면 창을 다시 만들어 칸의 숫자를 서버 값에 맞춘다   // 캡슐 분배가 바뀌면 창도 다시 만든다
  if(sig!==RD.sig){RD.sig=sig;if(curWin&&curWin.raid)refreshWin()}
  else if(curWin&&curWin.raid&&RD.liveFn)RD.liveFn();
  updatePlazaHud();
}
function raidOnState(r){
  if(!isMem(r))return;
  if(r.st==="p1"||r.st==="p2"||r.st==="p3"){
    RD.add={u:0,a:0};RD.v3={n2:0,o2:0,he:0};
    if(!dl&&(!curWin||curWin.raid)){if(curWin)refreshWin();else winRaid()}
  }else if(r.st==="won"||r.st==="lost"){
    if(RD.done!==r.seq){
      RD.done=r.seq;
      // 보상은 레이드(seq)마다 한 번만: 마지막으로 받은 seq 를 저장 데이터에 남겨 새로고침·재입장에서도 중복 지급을 막는다.
      if(r.st==="won"&&S.flags.raidSeq!==r.seq){S.flags.raidSeq=r.seq;const c=60+20*(r.N||1);S.coins+=c;S.flags.raidWins=(S.flags.raidWins||0)+1;toast(`🎉 레이드 클리어! 🪙 ${c} 코인을 받았어요.`,5000);save()}
    }
    if(!dl&&(!curWin||curWin.raid)){if(curWin)refreshWin();else winRaid()}
  }
}

// 섬의 실루엣과 중앙 증류솥. 솥 꼭대기 좌표를 돌려준다.
function cutIsland(cx,base,sc,p){
  const c1=mixc("#0c1a22","#3f7f4a",p*.8+.1),c2=mixc("#14262c","#6db35c",p*.8+.1),w=46*sc;
  Q(cx-w,base-3*sc,w*2,3*sc,c1);Q(cx-w*.8,base-6*sc,w*1.6,3*sc,c2);Q(cx-w*.5,base-9*sc,w,3*sc,c1);
  Q(cx-w-2,base,w*2+4,1,"rgba(255,255,255,.35)");   // 해안의 물거품
  Cd(cx-w*.62,base-8*sc,3*sc,c2);Cd(cx+w*.6,base-8*sc,3.4*sc,c2);Cd(cx+w*.42,base-10*sc,2.4*sc,c1);   // 나무 덩어리
  if(p<.9){const wl=`rgba(255,208,120,${(.95*(1-p)).toFixed(2)})`;Q(cx-w*.38,base-5*sc,2,2,wl);Q(cx+w*.3,base-5*sc,2,2,wl);Q(cx-w*.1,base-6*sc,2,2,wl)}   // 연구소 창문 불빛
  Q(cx-4*sc,base-14*sc,8*sc,6*sc,"#2c2c38");Q(cx-6*sc,base-16*sc,12*sc,3*sc,"#3a3a48");Q(cx-1.5*sc,base-20*sc,3*sc,5*sc,"#3a3a48");
  Q(cx-4*sc,base-14*sc,8*sc,1,"#4a4a5c");Q(cx-3*sc,base-12*sc,2*sc,2*sc,p<.9?"rgba(255,150,70,.85)":"#4a4a5c");   // 솥 입구의 불빛
  return{x:cx,y:base-20*sc};
}
function cutSteam(x,y,size,yel,fl){
  for(let i=0;i<14;i++){
    const ph=(CUT.g*.45+i/14)%1,yy=y-ph*72*size,xx=x+Math.sin(CUT.g*1.2+i*1.7)*(3+ph*10*size),r=Math.max(1,Math.round((2+ph*9)*size)),al=(1-ph)*.55*fl;
    Cd(xx,yy,r,`rgba(255,255,${Math.round(255-yel*120)},${al.toFixed(2)})`);
  }
}

const CUT_TINT={};
function cutSprite(s){

function cutFigure(x,fy,m,label){

function cutLantern(x,y){

function cutDeck(top,showNames){
  const bob=Math.round(Math.sin(CUT.g*1.3));

function cutRender(){
  CUT.labels=[];
  const s=CUT.shot,t=CUT.t,G=CUT.g,fl=Math.max(.15,.55+.45*Math.sin(G*5.3)*Math.sin(G*2.1+1));
  if(s===0){
    cutSky(0);cutSea(0);const pot=cutIsland(160,114,.9,0);cutSteam(pot.x,pot.y,.8,0,fl);
  }else if(s===1){
    cutSky(0);cutSea(0);const pot=cutIsland(160,114,.9,0);
    cutSteam(pot.x,pot.y,.9+.6*(.5+.5*Math.sin(t*1.3)),clamp(t/8,0,1),1);
  }else if(s===2){
    cutSky(.1);cutSea(.1);const pot=cutIsland(250,114,.5,.1);cutSteam(pot.x,pot.y,.5,1,.8);
    cutDeck(140,true);
  }else if(s===3){
    const p=clamp(.25+t/8*.75,0,1);
    cutSky(p);cutSea(p);const pot=cutIsland(160,113,1.5,p);cutSteam(pot.x,pot.y,.55,.6,.8);
    Q(112,113,30,3,"#8a5a34");Q(112,116,30,1,"#5a3a24");Q(114,116,2,5,"#5a3a24");Q(138,116,2,5,"#5a3a24");   // 부두

    cutDeck(176,false);
  }else{
    cutSky(1);cutSea(1);cutIsland(160,115,.8,1);
    const k=clamp(t/3,0,1);
    for(let i=0;i<16;i++){const a=i/16*6.283+G*.5,R_=(1-k)*70+4;Cd(160+Math.cos(a)*R_,90+Math.sin(a)*R_*.6,Math.round(4+k*6),"rgba(255,255,255,.35)")}
  }
  if(G<1.2){g.fillStyle=`rgba(0,0,0,${(1-G/1.2).toFixed(2)})`;g.fillRect(0,0,VW,VH)}
}
function cutOverlay(){
  ctx.textAlign="center";ctx.lineJoin="round";ctx.font=`bold 14px ${FONT}`;

let hudT=0,last=performance.now(),saveT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(started){
    typeDlg(dt);
    if(fade.dir===1){fade.a+=dt*4;if(fade.a>=1){fade.a=1;fade.cb&&fade.cb();fade.cb=null;fade.dir=-1}}
    else if(fade.dir===-1){fade.a-=dt*4;if(fade.a<=0){fade.a=0;fade.dir=0}}
    waterCd-=dt;iceCd-=dt;for(const k in shakeT)if(shakeT[k]>0)shakeT[k]-=dt;
    for(let i=floaters.length-1;i>=0;i--){floaters[i].a+=dt*1.1;if(floaters[i].a>=1)floaters.splice(i,1)}
    if(!busy()){
      if(scene!=="plaza"){S.min+=dt*2;if(S.min>=1440){S.min-=1440;newDay()}}
      movePlayer(dt);
      if(scene==="out"){
        const tx=Math.floor(P.x/16),ty=Math.floor(P.y/16);
        for(const d of OUT.doors)if(d.tx===tx&&d.ty===ty&&!lockedD(d)){enterDoor(d);break}
      }else if(scene!=="plaza"&&Math.floor(P.y/16)>=CUR.h-1&&Math.abs(P.x-(CUR.ex*16+8))<10)exitHouse();
    }else P.moving=false;
    if(scene==="out")updateDalton(dt);
    if(scene==="plaza")plazaUpdate(dt);
    else if(scene==="cut"){CUT.t+=dt;CUT.g+=dt;if(NET.ok)netSend(dt)}
    pickTarget();updateCam(dt);animStep(dt);
    hudT-=dt;if(hudT<=0){hudT=.25;updateHud()}
    saveT+=dt;if(saveT>30){saveT=0;if(!busy())save()}
  }
  render();
}
addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT")return;
  if(scene==="cut"){if(!e.repeat&&e.code==="Escape")CUT.skip=true;return}
  if(!started)return;
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.code==="Escape"){if(curWin)closeWin();return}
  if(dl){if(!e.repeat)dlgKey(e.code);return}
  if(!e.repeat){
    if(e.code==="KeyI"){curWin&&$("wt").textContent.includes("보관함")?closeWin():winInv();return}
    if(e.code==="KeyQ"){curWin&&$("wt").textContent.includes("일지")?closeWin():winJournal();return}
    if(e.code==="KeyM"){curWin&&$("wt").textContent.includes("지도")?closeWin():winMap();return}
    if(e.code==="KeyH"){curWin&&$("wt").textContent.includes("도움말")?closeWin():winHelp();return}
  }
  if(scene==="plaza"&&!e.repeat&&plazaKey(e.code))return;
  if(curWin||fade.dir)return;
  keys[e.code]=true;
  if(!e.repeat&&(e.code==="KeyE"||e.code==="Space"||e.code==="Enter")&&target)target.act();
});

<script>
/* ===== 모바일 인터페이스 계층 =====
   게임 로직(이동·상호작용·충돌·저장)은 건드리지 않는다. 기존 입력 경로만 호출한다.
   - 이동: 기존 keys 객체에 방향키 값을 쓴다(movePlayer 가 그대로 읽음). 실제 키보드 상태와 합쳐서 충돌을 막는다.
   - 행동·가방·메뉴: window 의 기존 keydown 핸들러에 KeyboardEvent 를 보낸다(E, I, Q, M, H).
   - 화면: html.mob 클래스로 레이아웃만 바꾸고, 캔버스를 플레이어 중심으로 확대·이동시킨다. */
(()=>{
"use strict";
const root=document.documentElement,game=document.getElementById("game"),cv=document.getElementById("cv");
const pad=document.getElementById("pad"),knob=document.getElementById("padknob"),bAct=document.getElementById("bAct"),bBag=document.getElementById("bBag"),bMenu=document.getElementById("bMenu");
const cap=document.getElementById("mobcap"),menu=document.getElementById("mobmenu"),force=new URLSearchParams(location.search).get("mobile");
const st={mob:false,ctl:false,z:1,aw:0,ah:0};let lastT="",lastCap="";
const kb={};
addEventListener("keydown",e=>{kb[e.code]=true},true);addEventListener("keyup",e=>{kb[e.code]=false},true);
const touchCap=()=>(navigator.maxTouchPoints||0)>0||"ontouchstart" in window||matchMedia("(pointer:coarse)").matches;
function decide(){
  const big=Math.max(innerWidth,innerHeight)>1366;
  if(force==="1"){st.mob=st.ctl=true}else if(force==="0"){st.mob=st.ctl=false}
  else{st.ctl=touchCap()&&!big;st.mob=st.ctl||innerWidth<=700}
}
const fire=(type,code)=>dispatchEvent(new KeyboardEvent(type,{code,key:code.replace("Key","").toLowerCase(),bubbles:true,cancelable:true}));
// ---- 방향 패드
const DIRS={L:"ArrowLeft",R:"ArrowRight",U:"ArrowUp",D:"ArrowDown"},flags={L:0,R:0,U:0,D:0},arrows={};
pad.querySelectorAll("i").forEach(i=>arrows[i.dataset.d]=i);
function applyFlags(){for(const k in DIRS){keys[DIRS[k]]=!!flags[k]||!!kb[DIRS[k]];arrows[k].classList.toggle("on",!!flags[k])}}
let padId=null;
function padRelease(){padId=null;flags.L=flags.R=flags.U=flags.D=0;knob.style.transform="";pad.classList.remove("down");applyFlags()}
function padMove(e){
  const r=pad.getBoundingClientRect(),R=r.width/2,dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R),m=Math.hypot(dx,dy);
  if(m<R*.2){flags.L=flags.R=flags.U=flags.D=0}
  else{flags.L=dx<0&&-dx>m*.38;flags.R=dx>0&&dx>m*.38;flags.U=dy<0&&-dy>m*.38;flags.D=dy>0&&dy>m*.38}
  const k=m?Math.min(m,R*.55)/m:0;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;applyFlags();
}
pad.addEventListener("pointerdown",e=>{if(padId!==null)return;padId=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();padMove(e)});
pad.addEventListener("pointermove",e=>{if(e.pointerId===padId)padMove(e)});
for(const t of["pointerup","pointercancel","lostpointercapture"])pad.addEventListener(t,e=>{if(e.pointerId===padId)padRelease()});
pad.addEventListener("pointerleave",e=>{if(e.pointerId===padId&&!(pad.hasPointerCapture&&pad.hasPointerCapture(e.pointerId)))padRelease()});
// ---- 누르는 동안만 동작하는 버튼(행동·가방·메뉴): 포인터별로 구분하므로 이동 손가락과 동시에 쓸 수 있다
function bind(el,down,up){
  let id=null;
  el.addEventListener("pointerdown",e=>{if(id!==null)return;id=e.pointerId;try{el.setPointerCapture(id)}catch(_){}el.classList.add("down");e.preventDefault();down&&down()});
  const end=e=>{if(e.pointerId!==id)return;id=null;el.classList.remove("down");up&&up()};
  for(const t of["pointerup","pointercancel","lostpointercapture"])el.addEventListener(t,end);
  el.addEventListener("pointerleave",e=>{if(e.pointerId===id&&!(el.hasPointerCapture&&el.hasPointerCapture(id)))end(e)});
  return()=>{if(id!==null){id=null;el.classList.remove("down");up&&up()}};
}
const relAct=bind(bAct,()=>fire("keydown","KeyE"),()=>fire("keyup","KeyE"));
const relBag=bind(bBag,()=>{fire("keydown","KeyI");fire("keyup","KeyI")});
const relMenu=bind(bMenu,()=>menu.classList.toggle("open"));
menu.addEventListener("click",e=>{
  const b=e.target.closest("[data-m]");if(!b)return;const m=b.dataset.m;
  if(m==="close"){}
  else if(m==="save"){if(started){const ok=save();toast(ok?"💾 저장했어요.":"⚠️ 이 환경에서는 저장이 막혀 있어요.")}}
  else if(m==="full"){try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}catch(_){}}
  else{fire("keydown",m);fire("keyup",m)}
  menu.classList.remove("open");
});
// 대화창을 눌러 넘기기(선택지는 기존대로 직접 누른다)
// 터치는 pointerup 으로 즉시 처리하고, 뒤따르는 호환용 click 은 무시한다(선택지·대화창 모두).
{const dlgEl=document.getElementById("dlg"),optsEl=document.getElementById("dopts");let lastTouch=0;
  const advance=()=>{if(dl&&(!dl.opts||dl.shown<dl.text.length)){fire("keydown","KeyE");fire("keyup","KeyE")}};
  dlgEl.addEventListener("pointerup",e=>{
    if(!st.mob||e.pointerType==="mouse")return;
    const o=e.target.closest&&e.target.closest(".opt");lastTouch=Date.now();
    if(o){const i=[...optsEl.children].indexOf(o);if(i>=0)chooseOpt(i)}else advance();
  });
  dlgEl.addEventListener("click",e=>{if(!st.mob)return;if(Date.now()-lastTouch<600)return;if(e.target.closest(".opt"))return;advance()});
}
// ---- 입력이 남지 않도록 하는 안전장치
function releaseAll(){padRelease();relAct();relBag();relMenu()}
addEventListener("blur",releaseAll);addEventListener("pagehide",releaseAll);
document.addEventListener("visibilitychange",()=>{if(document.hidden)releaseAll()});
addEventListener("pointerup",e=>{if(e.pointerId===padId)padRelease()},true);
addEventListener("pointercancel",e=>{if(e.pointerId===padId)padRelease()},true);
// ---- 브라우저 기본 동작 억제(조작 영역에 한정): 확대·길게 누르기 메뉴·스크롤
document.addEventListener("gesturestart",e=>e.preventDefault());
game.addEventListener("touchmove",e=>{if(!st.mob)return;if(e.target.closest&&e.target.closest("#wb"))return;e.preventDefault()},{passive:false});
game.addEventListener("contextmenu",e=>{if(st.mob)e.preventDefault()});
// ---- 레이아웃
function place(){
  if(!st.aw)return;
  const cc=scene==="cut"?[VW/2,VH/2]:[P.x-cam.x,P.y-cam.y];   // 컷신은 화면 중앙 고정
  const z=st.z,W=960*z,H=600*z,px=cc[0]*3*z,py=cc[1]*3*z;
  const tx=Math.min(0,Math.max(st.aw-W,st.aw/2-px)),ty=Math.min(0,Math.max(st.ah-H,st.ah/2-py));
  const s=`translate(${Math.round(tx)}px,${Math.round(ty)}px)`;if(s!==lastT){cv.style.transform=s;lastT=s}
}
function layout(){
  decide();
  const vv=window.visualViewport,vw=Math.round(vv?vv.width:innerWidth),vh=Math.round(vv?vv.height:innerHeight),portrait=vh>vw;
  root.classList.toggle("mob",st.mob);root.classList.toggle("touch",st.ctl);
  root.classList.toggle("portrait",st.mob&&portrait);root.classList.toggle("landscape",st.mob&&!portrait);
  root.style.setProperty("--vw",vw+"px");root.style.setProperty("--vh",vh+"px");
  const ctrl=st.mob&&st.ctl&&portrait&&!root.classList.contains("cutscene")?Math.round(Math.min(230,Math.max(176,vh*.27))):0;   // 컷신 중에는 조작 패드가 없으니 그 자리까지 화면으로 쓴다
  root.style.setProperty("--ctrl",ctrl+"px");
  releaseAll();menu.classList.remove("open");
  if(!st.mob){cv.style.width="";cv.style.height="";cv.style.transform="";lastT="";st.aw=0;return}
  st.aw=vw;st.ah=vh-ctrl;st.z=Math.max(vw/960,st.ah/600,.83);
  cv.style.width=Math.round(960*st.z)+"px";cv.style.height=Math.round(600*st.z)+"px";lastT="";place();
}
addEventListener("resize",layout);addEventListener("orientationchange",()=>setTimeout(layout,120));
if(window.visualViewport)visualViewport.addEventListener("resize",layout);
layout();
// ---- 매 프레임: 플레이어 중심으로 캔버스 이동, 현재 행동 대상 표시, 대화·창이 열려 있으면 가로 화면의 조작 UI 숨김
(function loop(){
  if(st.mob)place();
  const busy=!!(dl||curWin);
  root.classList.toggle("ui-busy",busy);root.classList.toggle("playing",!!started);
  let txt="";
  if(st.ctl&&started&&!busy&&target){try{txt=typeof target.label==="function"?target.label():target.label}catch(_){}}
  if(txt!==lastCap){cap.textContent=txt?"행동: "+txt:"";lastCap=txt}
  requestAnimationFrame(loop);
})();
})();
</script>
</body>
</html>
